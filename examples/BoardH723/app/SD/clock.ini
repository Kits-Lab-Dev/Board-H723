; Настройки рецепта lvgl_clock: часы и погода на дисплее.
; Строки "ключ = значение", кодировка UTF-8. Строки с ";" в начале — комментарии.

; Сеть Wi-Fi (2,4 ГГц). Пустой ssid — плата сама не подключается и ждёт,
; пока Wi-Fi поднимет кто-то другой (например /SD/boot.lua в прошивке с Lua).
ssid = my_wifi
password = my_password

; Город — по-русски или латиницей; координаты и часовой пояс найдёт open-meteo.com
city = Москва

; Вместо города — координаты (градусы, северная широта и восточная долгота — плюс):
; latitude = 55.7558
; longitude = 37.6173

; Часовой пояс берётся по месту. Задать вручную — часы от UTC (бывает дробным: 5.5):
; utc_offset = 3
